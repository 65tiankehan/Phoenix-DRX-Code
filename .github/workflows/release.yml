# 发布流水线（四仓纪律：本仓为代码仓，安装包一律发布到 Phoenix-DRX-releases）
# 触发：push master / PR / tag v* / 手动 —— verify 全跑；build 仅在 tag 上跑
name: release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建发布的 tag（如 v0.1.6）。手动触发时填此项即可走完整构建+发布；留空则仅跑 verify。'
        required: false
        default: ''

env:
  RELEASE_REPO: 65tiankehan/Phoenix-DRX-releases

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test

  build-windows:
    # tag 推送 或 手动传入 tag 才构建发布；日常 push / PR 只验证
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            installer/src-tauri
      - run: npm ci

      - name: 解析发布 tag
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { '${{ github.event.inputs.tag }}' } else { '${{ github.ref_name }}' }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8NoBOM
          Write-Host "RELEASE_TAG=$tag"

      - name: 检查签名密钥存在
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Error '缺少 TAURI_SIGNING_PRIVATE_KEY，更新签名产物无法生成'
          }

      - name: 构建（含更新签名产物）
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: 构建 DRX-Setup 安装器壳
        run: cargo build --release --manifest-path installer/src-tauri/Cargo.toml

      - name: 拼接载荷生成自研安装包
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $payload = 'src-tauri/target/release/payload'
          New-Item -ItemType Directory -Force $payload | Out-Null
          Copy-Item src-tauri/target/release/phoenix-drx.exe $payload/
          $outDir = 'src-tauri/target/release/bundle/drx-setup'
          New-Item -ItemType Directory -Force $outDir | Out-Null
          node installer/scripts/append-payload.mjs $payload `
            installer/src-tauri/target/release/phoenix-drx-setup.exe `
            "$outDir/Phoenix-DRX_${version}_x64-installer.exe"

      - name: 签名自研安装包（更新器校验用）
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/drx-setup' -Filter '*-installer.exe' | Select-Object -First 1
          if (-not $installer) { Write-Error '缺少自研安装包' }
          npx tauri signer sign $installer.FullName
          if ($LASTEXITCODE -ne 0) { Write-Error '自研安装包签名失败' }
          Get-ChildItem 'src-tauri/target/release/bundle/drx-setup'

      - name: 生成更新清单 latest.json
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          # 过渡期：latest.json 指向自研安装包（DRX-Setup，静默 /S /P 兼容 NSIS 参数）；
          # 签名必须是安装包本体的 minisign 签名（更新器先验签再静默运行）
          $installerSig = Get-ChildItem 'src-tauri/target/release/bundle/drx-setup' -Filter '*-installer.exe.sig' | Select-Object -First 1
          if (-not $installerSig) { Write-Error '缺少自研安装包签名文件' }
          $exeName = $installerSig.Name -replace '\.sig$', ''
          $json = [ordered]@{
            version   = $conf.version
            notes     = "Phoenix-DRX $tag 发布，详情见发布页。"
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content $installerSig.FullName -Raw).Trim()
                url       = "https://ghfast.top/https://github.com/$env:RELEASE_REPO/releases/download/$tag/$exeName"
              }
            }
          }
          $out = 'src-tauri/target/release/bundle/latest.json'
          ConvertTo-Json -InputObject $json -Depth 5 | Set-Content $out -Encoding utf8NoBOM
          Write-Host "latest.json 已生成 → $out"
          Get-Content $out

      - name: 打包 Forge 上架 zip
        shell: pwsh
        run: |
          # SPT Forge 的 Download Link 只接受 .7z / .zip，exe 会被拒；
          # zip 里放自研安装包 + 安装说明，玩家解压后运行 exe。
          $version = $env:RELEASE_TAG.TrimStart('v')
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/drx-setup' -Filter '*-installer.exe' | Select-Object -First 1
          if (-not $installer) { Write-Error '缺少自研安装包' }
          & ./scripts/pack-forge.ps1 -Installer $installer.FullName -Version $version -OutDir 'src-tauri/target/release/bundle'
          if ($LASTEXITCODE -ne 0) { Write-Error 'Forge 上架包打包失败' }

      - name: 校验产物齐全
        shell: pwsh
        run: |
          $bundle = 'src-tauri/target/release/bundle'
          $files = Get-ChildItem $bundle -Recurse -Include *.msi,*.exe,*.sig,*.zip,latest.json
          $files | ForEach-Object { Write-Host "$($_.FullName)  $([math]::Round($_.Length/1MB,1)) MB" }
          if (-not ($files | Where-Object Name -like '*.msi'))  { Write-Error '缺少 msi 安装包' }
          if (-not ($files | Where-Object Name -like '*-setup.exe')) { Write-Error '缺少 nsis 安装包' }
          if (-not ($files | Where-Object Name -like '*-installer.exe')) { Write-Error '缺少自研安装包' }
          if (-not ($files | Where-Object Name -like '*-win-x64.zip')) { Write-Error '缺少 Forge 上架 zip' }
          if (-not ($files | Where-Object Name -like '*.sig')) { Write-Error '缺少更新签名文件' }
          if (-not ($files | Where-Object Name -eq 'latest.json')) { Write-Error '缺少 latest.json 更新清单' }

      - name: 发布到发版仓
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          $tag = $env:RELEASE_TAG
          $files = Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe,*.sig,*.zip,latest.json |
            ForEach-Object { $_.FullName }
          gh release create $tag --repo $env:RELEASE_REPO --title $tag --notes "Phoenix-DRX $tag，由发布流水线自动构建发布；latest.json 供应用内更新使用。" @files
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'release 已存在，回退为覆盖上传'
            gh release upload $tag --repo $env:RELEASE_REPO --clobber @files
          }
          if ($LASTEXITCODE -ne 0) { Write-Error '发布失败' }
