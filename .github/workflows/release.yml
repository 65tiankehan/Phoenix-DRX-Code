# 发布流水线（四仓纪律：本仓为代码仓，安装包一律发布到 Phoenix-DRX-releases）
# 触发：push master / PR / tag v* / 手动 —— verify 全跑；build 仅在 tag 上跑
name: release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  RELEASE_REPO: 65tiankehan/Phoenix-DRX-releases

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test

  build-windows:
    # 仅 tag 构建发布：日常 push / PR 只验证
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: 检查签名密钥存在
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Error '缺少 TAURI_SIGNING_PRIVATE_KEY，更新签名产物无法生成'
          }

      - name: 构建（含更新签名产物）
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: 校验产物齐全
        shell: pwsh
        run: |
          $bundle = 'src-tauri/target/release/bundle'
          $files = Get-ChildItem $bundle -Recurse -Include *.msi,*.exe,*.sig,latest.json
          $files | ForEach-Object { Write-Host "$($_.FullName)  $([math]::Round($_.Length/1MB,1)) MB" }
          if (-not ($files | Where-Object Name -like '*.msi'))  { Write-Error '缺少 msi 安装包' }
          if (-not ($files | Where-Object Name -like '*-setup.exe')) { Write-Error '缺少 nsis 安装包' }
          if (-not ($files | Where-Object Name -like '*.sig')) { Write-Error '缺少更新签名文件' }
          if (-not ($files | Where-Object Name -eq 'latest.json')) { Write-Error '缺少 latest.json 更新清单' }

      - name: 发布到发版仓
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe,*.sig,latest.json |
            ForEach-Object { $_.FullName }
          gh release create $tag --repo $env:RELEASE_REPO --title $tag --generate-notes @files
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'release 已存在，回退为覆盖上传'
            gh release upload $tag --repo $env:RELEASE_REPO --clobber @files
          }
          if ($LASTEXITCODE -ne 0) { Write-Error '发布失败' }
